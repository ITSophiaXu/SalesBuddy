limit_req_zone $binary_remote_addr zone=motive_generation:10m rate=10r/m;

server {
    listen 127.0.0.1:4175;
    server_name _;
    client_max_body_size 500k;

    location ~ ^/api/(generate|chat)$ {
        limit_req zone=motive_generation burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_read_timeout 150s;
        proxy_set_header Host 127.0.0.1:4174;
        proxy_set_header Origin http://127.0.0.1:4174;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4174;
        proxy_set_header Origin http://127.0.0.1:4174;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
